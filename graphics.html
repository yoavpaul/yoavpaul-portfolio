<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphics – Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="graphics-page">
  <!-- Top bar (stays at the top while scrolling, with a soft blur behind it):
       on the left the menu (the page you are on in red; a click on "Index" folds it, see top-bar-menu.js),
       "YP" in the middle (leads home), Contact on the right -->
  <header class="top-bar">
    <p class="top-bar-left"><button class="page-link top-bar-index" type="button" aria-expanded="true">Index</button><a class="page-link menu-other" href="branding.html">Branding</a><a class="page-link menu-other" href="photography.html">Photography</a><span class="is-current">Graphics</span></p>
    <a class="top-bar-name" href="index.html" aria-label="Yoav Paul, home page">YP</a>
    <a class="top-bar-contact" href="about.html">Contact</a>
  </header>

  <!-- Big title. Sizes in Figma pixels -->
  <header class="project-header" style="--title-top: 90; --title-size: 230; --header-height: 638;">
    <h1 class="project-title">Graphics</h1>
  </header>

  <!-- The works and their names. Sizes are in Figma pixels (see "Columns and rows" in styles.css) -->
  <main class="figma-column">

    <!-- 1+1= : a video of the book's pages turning, with a see-through background.
         Two copies of the video: .mov for Safari, .webm for Chrome and Firefox -->
    <div id="one-plus-one" class="photo-box from-left" style="--left: 335; --width: 800; --height: 602;">
      <video autoplay muted loop playsinline aria-label="1+1=, the pages turning">
        <source src="images/one-plus-one-spreads.mov" type="video/quicktime">
        <source src="images/one-plus-one-spreads.webm" type="video/webm">
      </video>
    </div>

    <!-- I'M HERE? (Tartoctober posters): a click on the poster opens a row with the 3 posters,
         like the photography page. A click on any poster of the open row closes it.
         --x, --y = where each poster starts, --w, --h = its size (Figma pixels) -->
    <div id="im-here" class="photo-overlay from-left" style="--left: 344; --space-before: 162;">
      <div class="photo-overlay-row" style="--width: 2197;">
        <button class="photo-box" aria-expanded="false" style="--width: 694; --height: 982;">
          <img src="images/tartakover-poster.jpg" alt="I'M HERE? poster, red">
        </button>
        <div style="--x: 754; --y: 0; --w: 689; --h: 975;"><img src="images/tartakover-poster-black.jpg" alt="I'M HERE? poster, black (exhibition)" loading="lazy"></div>
        <div style="--x: 1508; --y: 1; --w: 689; --h: 974;"><img src="images/tartakover-poster-green.jpg" alt="I'M HERE? poster, green" loading="lazy"></div>
      </div>
    </div>
    <p class="photo-caption from-left" style="--left: 344; --width: 391; --height: 38; --space-before: 30;">I’M HERE?</p>

    <div id="soccer-joint" class="photo-box from-left" style="--left: 256; --width: 907; --height: 1296; --space-before: 135;">
      <img src="images/poster-joint-soccer.jpg" alt="Soccer - Joint poster">
    </div>
    <p class="photo-caption from-left" style="--left: 256; --width: 391; --height: 38; --space-before: 20;">Soccer - Joint</p>

    <!-- The poster moving (a screen recording) -->
    <div class="photo-box from-left" style="--left: 207; --width: 1005; --height: 589; --space-before: 135;">
      <video src="images/soccer-joint-poster-motion.mp4" autoplay muted loop playsinline aria-label="Soccer - Joint, the poster moving"></video>
    </div>

    <!-- The notebook's pages turning, with a see-through background (.mov for Safari, .webm for the others) -->
    <div class="photo-box from-left" style="--left: 277; --width: 886; --height: 667; --space-before: 193;">
      <video autoplay muted loop playsinline aria-label="Soccer - Joint, the notebook's pages turning">
        <source src="images/soccer-joint-spreads.mov" type="video/quicktime">
        <source src="images/soccer-joint-spreads.webm" type="video/webm">
      </video>
    </div>
  </main>

  <script src="photo-overlays.js"></script>
  <script src="top-bar-menu.js"></script>
  <script src="top-bar-blur.js"></script>
</body>
</html>
