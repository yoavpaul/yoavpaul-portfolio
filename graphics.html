<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphics – Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The phone version: only on screens up to 700px wide -->
  <link rel="stylesheet" href="phone.css" media="(max-width: 700px)">
</head>
<body class="graphics-page">
  <!-- Top bar (stays at the top while scrolling, with a soft blur behind it):
       on the left the menu (the page you are on in red; a click on "Index" folds it, see top-bar-menu.js),
       "YP" in the middle (leads home), Contact on the right -->
  <header class="top-bar">
    <p class="top-bar-left is-folded"><button class="page-link top-bar-index" type="button" aria-expanded="false">Index</button><a class="page-link menu-other" href="branding.html">Branding</a><a class="page-link menu-other" href="photography.html">Photography</a><span class="is-current">Graphics</span></p>
    <a class="top-bar-name" href="index.html" aria-label="Yoav Paul, home page">YP</a>
    <a class="top-bar-contact" href="about.html">Contact</a>
  </header>

  <!-- Big title. Sizes in Figma pixels -->
  <header class="project-header" style="--title-top: 90; --title-size: 230; --header-height: 638;">
    <h1 class="project-title">Graphics</h1>
  </header>

  <!-- The works and their names. Sizes are in Figma pixels (see "Columns and rows" in styles.css) -->
  <main class="figma-column">

    <!-- 1+1= : the book (Hebrew, right to left). It turns its pages by itself until a click;
         then a click on the left page shows the next pages, on the right page the pages before (book-pages.js).
         images/one-plus-one-page-00.webp is the cover, 01 to 28 are the pages (see-through background) -->
    <div id="one-plus-one" class="photo-box from-left book" tabindex="0" role="button" aria-label="1+1=, click to turn the pages" style="--left: 335; --width: 800; --height: 602;">
      <img src="images/one-plus-one-page-00.webp" width="1360" height="1024" alt="1+1=, the cover">
    </div>

    <p class="photo-caption from-left" style="--left: 448; --width: 391; --height: 38;">1+1 =</p>

    <!-- I'M HERE? (Tartoctober posters): a click on the poster opens a row with the 3 posters,
         like the photography page. A click on any poster of the open row closes it.
         --x, --y = where each poster starts, --w, --h = its size (Figma frame "Im here?").
         The first poster is smaller on the page (523 instead of 689), so the whole row is
         made smaller the same way: --row-scale = 523 / 689 -->
    <div id="im-here" class="photo-overlay from-left" style="--left: 448; --space-before: 179; --row-scale: 0.759;">
      <div class="photo-overlay-row" style="--width: 2167;">
        <button class="photo-box" aria-expanded="false" style="--width: 523; --height: 740;">
          <img src="images/tartakover-poster.webp" width="1697" height="2400" alt="I'M HERE? poster, red">
        </button>
        <div style="--x: 739; --y: 0; --w: 689; --h: 975;"><img src="images/tartakover-poster-black.webp" width="1697" height="2400" alt="I'M HERE? poster, black (exhibition)" loading="lazy"></div>
        <div style="--x: 1478; --y: 0; --w: 689; --h: 974;"><img src="images/tartakover-poster-green.webp" width="1697" height="2400" alt="I'M HERE? poster, green" loading="lazy"></div>
      </div>
    </div>
    <p class="photo-caption from-left" style="--left: 448; --width: 391; --height: 38; --space-before: 33;">I’M HERE?</p>

    <!-- On The Line - Soccer: the notebook's pages turning (see-through background, .mov for Safari, .webm for the others).
         A click opens the whole project on the screen, on the grass (see "soccer-panel" at the bottom),
         like the projects on the branding page -->
    <button id="soccer-joint" class="photo-box from-left" type="button" data-panel="soccer-panel" aria-haspopup="dialog" style="--left: 297; --width: 851; --height: 641; --space-before: 50;">
      <video autoplay muted loop playsinline aria-label="On The Line - Soccer, the notebook's pages turning">
        <source src="images/soccer-joint-spreads.mov" type="video/quicktime">
        <source src="images/soccer-joint-spreads.webm" type="video/webm">
      </video>
    </button>
    <p class="photo-caption from-left" style="--left: 479; --width: 388; --height: 23; --space-before: -24;">On The Line - Soccer</p>
  </main>

  <!-- ===== On The Line - Soccer: the whole project on one screen, on the grass =====
       It opens on top of the page and scrolls only sideways (project-panels.js), like on the branding page.
       The works are placed like in the Figma frame "On The Line - Soccer", in the middle of the
       screen's height (the frame is 1069 high, like the branding projects), and grow or shrink with it.
       They are 57 apart: the first space is measured from where the notebook's pages end
       (its video has 34 see-through pixels on the right). The grass: #soccer-panel in styles.css.
       A click on any work (or the Esc key) closes it. -->
  <div class="project-panel" id="soccer-panel" role="dialog" aria-label="On The Line - Soccer" tabindex="-1" hidden>
    <div class="project-panel-stage" style="--width: 2223;">
      <div class="panel-item" style="--x: 80; --y: 214; --w: 851; --h: 641;"><video muted loop playsinline aria-label="The notebook's pages turning">
        <source src="images/soccer-joint-spreads.mov" type="video/quicktime">
        <source src="images/soccer-joint-spreads.webm" type="video/webm">
      </video></div>
      <div class="panel-item" style="--x: 954; --y: 284; --w: 773; --h: 453;"><video src="images/soccer-joint-poster-motion.mp4" poster="images/soccer-joint-poster-motion-poster.webp" muted loop playsinline preload="none" aria-label="The poster moving"></video></div>
      <div class="panel-item" style="--x: 1784; --y: 234; --w: 359; --h: 513;"><img src="images/poster-joint-soccer.webp" width="1680" height="2400" alt="On The Line - Soccer poster" loading="lazy"></div>
    </div>
  </div>

  <!-- On a phone held upright: after a project opens, a note asks to turn the phone sideways
       (it shows only on upright phones, see phone.css). A tap hides it -->
  <button class="rotate-hint" type="button" hidden>
    <svg class="rotate-hint-icon" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
      <rect x="14" y="6" width="20" height="34" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M40 24a16 16 0 0 1-8 13.9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M28 37l4 1.5-1 4" fill="none" stroke="currentColor" stroke-width="2"/>
    </svg>
    Turn your phone sideways<br>to see the whole project
  </button>


  <script src="photo-overlays.js"></script>
  <script src="project-panels.js"></script>
  <script src="book-pages.js"></script>
  <script src="top-bar-menu.js"></script>
  <script src="top-bar-blur.js"></script>
</body>
</html>
