<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Graphics – Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="graphics-page">
  <!-- Top bar: About, "YP" (leads home, stays on top while scrolling), Contact -->
  <header class="top-bar">
    <a class="top-bar-about" href="about.html#me">About</a>
    <a class="top-bar-name" href="index.html" aria-label="Yoav Paul, home page">YP</a>
    <a class="top-bar-contact" href="about.html">Contact</a>
  </header>

  <!-- Menu (on the left) and big title. Sizes in Figma pixels -->
  <header class="project-header" style="--nav-top: 32; --title-top: 90; --title-size: 230; --header-height: 613;">
    <nav class="project-nav at-left">
      <a class="page-link project-nav-index" href="projects.html">INDEX</a>
      <a class="page-link" href="branding.html">Branding</a>
      <a class="page-link" href="photography.html">Photography</a>
      <a class="page-link is-current" href="graphics.html">Graphics</a>
    </nav>
    <h1 class="project-title">Graphics</h1>
  </header>

  <!-- The works and their names. Sizes are in Figma pixels (see "Columns and rows" in styles.css) -->
  <main class="figma-column">

    <!-- I'M HERE? (Tartoctober posters): a click on the poster opens a row with the 3 posters,
         like the photography page. A click on any poster of the open row closes it.
         --x, --y = where each poster starts, --w, --h = its size (Figma pixels) -->
    <div class="photo-overlay from-left" style="--left: 345;">
      <div class="photo-overlay-row" style="--width: 2197;">
        <button class="photo-box" aria-expanded="false" style="--width: 694; --height: 982;">
          <img src="images/tartakover-poster.jpg" alt="I'M HERE? poster, red">
        </button>
        <div style="--x: 754; --y: 0; --w: 689; --h: 975;"><img src="images/tartakover-poster-black.jpg" alt="I'M HERE? poster, black (exhibition)" loading="lazy"></div>
        <div style="--x: 1508; --y: 1; --w: 689; --h: 974;"><img src="images/tartakover-poster-green.jpg" alt="I'M HERE? poster, green" loading="lazy"></div>
      </div>
    </div>
    <p class="photo-caption from-left" style="--left: 345; --width: 391; --height: 38; --space-before: 10;">I’M HERE?</p>

    <div class="photo-box from-left" style="--left: 267; --width: 907; --height: 1296; --space-before: 119;">
      <img src="images/poster-joint-soccer.jpg" alt="Soccer - Joint poster">
    </div>
    <p class="photo-caption from-left" style="--left: 267; --width: 391; --height: 38; --space-before: 6;">Soccer - Joint</p>

    <!-- The notebook flipbook video (from the old site). The picture shows until the video loads -->
    <div class="photo-box from-left" style="--left: 129; --width: 1183; --height: 789; --space-before: 122;">
      <video src="images/football-joint-notebook.mp4" poster="images/football-joint-flipbook.png" autoplay muted loop playsinline aria-label="Soccer - Joint, notebook flipbook"></video>
    </div>
  </main>

  <script src="photo-overlays.js"></script>
</body>
</html>
