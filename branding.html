<!DOCTYPE html>

</head>
<body>
  <!-- Menu and big title (top and height in Figma pixels) -->
  <header class="project-header" style="--title-top: 79; --header-height: 549;">
    <nav class="project-nav">

      <a class="page-link is-current" href="branding.html">Branding</a>

      <a class="page-link" href="graphics.html">Graphics</a>

    <h1 class="project-title">Branding</h1>

    <div class="figma-row" style="--gap: 11; --space-before: 7;">

      <div class="work-image work-crop" style="--width: 589;">
        <img class="work-crop-vest" src="images/vest.jpg" alt="Vest">

    <div class="figma-row" style="--gap: 15; --space-before: 49;">
      <img class="work-image" src="images/lodge-13-pickled-pickles.png" alt="Pickled story: pickles" style="--width: 450;">
      <img class="work-image" src="images/lodge-14-pickled-orange.png" alt="Pickled story: orange" style="--width: 449;">
      <img class="work-image" src="images/lodge-12-pickled-onion.png" alt="Pickled story: onion" style="--width: 449;">

    <h2 class="project-label" style="--space-before: 122;">biss</h2>

    <img class="work-image" src="images/logo-1.png" alt="biss logo" style="--width: 1336; --space-before: 19;">
    <img class="work-image" src="images/biss-product-boxes.png" alt="biss product boxes" style="--width: 1340; --space-before: 246;">
    <img class="work-image" src="images/biss-gum-boxes.png" alt="biss gum boxes" style="--width: 1340; --space-before: 39;">
    <img class="work-image" src="images/biss-chews-wisely.png" alt="biss Chews Wisely gum boxes" style="--width: 1340; --space-before: 39;">

    <img class="work-image" src="images/biss-display-booth.png" alt="biss display booth" style="--width: 1340; --space-before: 39;">
    <img class="work-image" src="images/biss-underwear-rack.png" alt="biss underwear rack" style="--width: 1340; --space-before: 39;">

    <video class="work-image biss-video" src="images/biss-instagram.mp4" autoplay muted loop playsinline
