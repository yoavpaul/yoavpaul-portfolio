<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <!-- Top bar: name, short description, contact -->
  <header class="top-bar">
    <a class="top-bar-name" href="about.html">YOAV PAUL</a>
    <p class="top-bar-description">A visual designer working across images and identities.</p>
    <p class="top-bar-contact">Contact</p>
  </header>

  <!-- Big name (the fly sits on it, see below) -->
  <section class="hero">
    <!-- "INDEX" is grey here and leads to the index page -->
    <p class="hero-index-link">OVER VIEW / <a class="page-link text-muted" href="projects.html">INDEX</a></p>
    <h1 class="hero-title">YOAVPAUL</h1>
  </section>

  <!-- The works, one under the other -->
  <main class="works">
    <video class="work" src="images/motion-poster.mp4" autoplay muted loop playsinline></video>

    <!-- Four images in two columns -->
    <div class="works-grid">
      <img class="work" src="images/teamtag.jpg" alt="Team tag">
      <img class="work" src="images/creator-tag.jpg" alt="Creator tag">
      <!-- The sidebag image is zoomed in a little, like in Figma -->
      <div class="work work-crop">
        <img class="work-crop-sidebag" src="images/sidebag.jpg" alt="Side bag">
      </div>
      <div class="work work-crop">
        <img class="work-crop-vest" src="images/vest.jpg" alt="Vest">
      </div>
    </div>

    <img class="work work-soccer" src="images/poster-joint-soccer.jpg" alt="Joint soccer poster">
    <img class="work work-yarzin" src="images/yarzin-photoshoot.jpg" alt="Yarzin photoshoot">
    <img class="work work-lodge" src="images/thelodge-logo.jpg" alt="The Lodge logo">
    <img class="work work-logo" src="images/logo-1.png" alt="Logo">
    <img class="work work-tartakover" src="images/tartakover-poster.jpg" alt="Tartakover poster">
  </main>

  <!-- The fly: sits on the name and flies away when the mouse touches it (moved by script.js) -->
  <img class="fly" src="images/fly.png" alt="" aria-hidden="true">

  <script src="script.js"></script>
</body>
</html>
