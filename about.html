<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The phone version: only on screens up to 700px wide -->
  <link rel="stylesheet" href="phone.css" media="(max-width: 700px)">
</head>
<body>
  <!-- Top bar (stays at the top while scrolling, with a soft blur behind it):
       on the left where you are, "YP" in the middle (leads home), Contact on the right -->
  <header class="top-bar">
    <p class="top-bar-left"><a class="page-link" href="index.html">Over view</a> / <a class="page-link text-muted" href="projects.html">Index</a></p>
    <a class="top-bar-name" href="index.html" aria-label="Yoav Paul, home page">YP</a>
    <a class="top-bar-contact" href="about.html">Contact</a>
  </header>

  <!-- Everything here is placed where it is in Figma (see .about in styles.css).
       --top = top in Figma pixels, --middle = the middle of the word (or line) -->
  <main class="about">

    <h1 class="about-title" style="--top: 118; --middle: 720; --spacing: 10.8;">EMAIL ME</h1>
    <!-- Email and phone: on a computer a "Copy" button shows next to them under the mouse,
         on a phone (and tablet) it shows after a tap (contact-copy.js) -->
    <p class="about-contact" style="--top: 519; --middle: 710.5;"><a href="mailto:Yoavpaul2012@gmail.com">Yoavpaul2012@gmail.com</a><span class="copy-holder"><button class="copy-button" type="button" data-copy="Yoavpaul2012@gmail.com">Copy</button></span></p>

    <h2 class="about-title" style="--top: 636; --middle: 720; --spacing: 10.8;">CALL ME</h2>
    <p class="about-contact" style="--top: 1037; --middle: 691.5;"><a href="tel:+972543017810">+972543017810</a><span class="copy-holder"><button class="copy-button" type="button" data-copy="+972543017810">Copy</button></span></p>

    <!-- "About" in the top bar jumps here -->
    <h2 class="about-title" id="me" style="--top: 1155; --middle: 722;">ME</h2>

    <!-- The text comes from content/about.md (about-text.js puts it here) -->
    <div class="about-text" style="--top: 1560;"></div>
  </main>
  <script src="about-text.js"></script>
  <script src="contact-copy.js"></script>
  <script src="top-bar-blur.js"></script>
</body>
</html>
