<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index – Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The phone version: only on screens up to 700px wide -->
  <link rel="stylesheet" href="phone.css" media="(max-width: 700px)">
</head>
<body class="index-page">
  <!-- Top bar (stays at the top while scrolling, with a soft blur behind it):
       on the left where you are, "YP" in the middle (leads home), Contact on the right -->
  <header class="top-bar">
    <p class="top-bar-left"><a class="page-link text-muted" href="index.html">Over view</a> / Index</p>
    <a class="top-bar-name" href="index.html" aria-label="Yoav Paul, home page">YP</a>
    <a class="top-bar-contact" href="about.html">Contact</a>
  </header>

  <!-- The three categories, each with the list of its projects under it (open all the time).
       A click on a category leads to its page, a click on a project leads to that project.
       Each one turns red under the mouse.
       The projects in the lists come from projects.json (index-menu.js puts them here, by their "order").
       Places are in Figma pixels (Figma frame "Index – screen + categories (site)"), from the top of the page.
       Each list is centered under the name of its category (its middle = the middle of the name):
       --x, --y = where it starts, --w = its width -->
  <main class="index-categories">
    <a class="index-category" href="branding.html" data-category="Branding" style="--x: 91; --y: 119; --w: 352;">Branding</a>
    <ul class="index-list" id="list-branding" style="--x: 69; --y: 215.6; --w: 282;"></ul>

    <a class="index-category" href="photography.html" data-category="Photography" style="--x: 541; --y: 119; --w: 380;">Photography</a>
    <ul class="index-list" id="list-photography" style="--x: 493.5; --y: 215.6; --w: 425;"></ul>

    <a class="index-category" href="graphics.html" data-category="Graphics" style="--x: 1096; --y: 119; --w: 316;">Graphics</a>
    <ul class="index-list" id="list-graphics" style="--x: 1068.5; --y: 215.6; --w: 285;"></ul>
  </main>

  <!-- The "screen" under the categories: all the works moving in a row, like the home page (home-carousel.js).
       Under the mouse on a category it shows only that category's works,
       and on the name of a project it shows that project (index-menu.js) -->
  <section class="carousel-section index-screen">
    <div class="carousel">
      <div class="carousel-track">
      <!-- The works come from projects.json (home-carousel.js puts them here) -->
      </div>
    </div>
    <!-- One project, under the mouse on its name (index-menu.js) -->
    <div class="index-preview" aria-hidden="true"></div>
    <!-- Under a finger on the row: the category (red) / the name of the work (home-carousel.js) -->
    <p class="carousel-modes">
      <span class="carousel-name" aria-hidden="true"><span class="carousel-category"></span> / <span class="carousel-work"></span></span>
    </p>
  </section>


  <script src="projects.js"></script>
  <script src="home-carousel.js"></script>
  <script src="index-menu.js"></script>
  <script src="top-bar-blur.js"></script>
  <!-- A click on "YP" turns it into a fly that flies off to the home page -->
  <script src="yp-fly.js"></script>
</body>
</html>
