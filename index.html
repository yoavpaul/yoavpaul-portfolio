<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <!-- IBM Plex Mono font from Google Fonts (for the small name) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- One screen with the title in the middle -->
  <main class="coming-soon">
    <!-- The small name sits between the two lines of the title -->
    <div class="title-wrapper">
      <h1 class="coming-soon-title">Coming Soon</h1>
      <p class="coming-soon-name">Yoav Paul<br>Portfolio</p>
    </div>
  </main>

  <!-- The fly that flies around the screen (moved by script.js) -->
  <img class="fly" src="images/fly.png" alt="" aria-hidden="true">

  <script src="script.js"></script>
</body>
</html>
