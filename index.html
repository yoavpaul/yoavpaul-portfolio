<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
  <!-- The phone version: only on screens up to 700px wide -->
  <link rel="stylesheet" href="phone.css" media="(max-width: 700px)">
  <!-- TEST for phones (only with ?mobile=test in the address, see the file) -->
  <script src="mobile-test.js"></script>
</head>
<body class="home-page">
  <!-- Top bar (stays at the top while scrolling, with a soft blur behind it):
       on the left where you are, "YP" in the middle (leads home), Contact on the right -->
  <header class="top-bar">
    <p class="top-bar-left">Over view / <a class="page-link text-muted" href="projects.html">Index</a></p>
    <a class="top-bar-name" href="index.html" aria-label="Yoav Paul, home page">YP</a>
    <a class="top-bar-contact" href="about.html">Contact</a>
  </header>

  <!-- Big name (the fly sits on it, see below) -->
  <section class="hero">
    <h1 class="hero-title">YOAVPAUL</h1>
  </section>

  <!-- Leads to the contact page. "ME" turns red under the mouse -->
  <p class="catch-me"><a class="page-link" href="about.html">Catch <span class="catch-me-big">ME</span> if you can!</a></p>

  <!-- Over view: all the works move slowly from left to right, in a loop (home-carousel.js).
       Under the mouse it keeps moving, and a tag next to the mouse shows the category and name of the work.
       It stops under a finger, and then "Random / Index" under it shows them instead,
       and it can be scrolled sideways (trackpad, mouse wheel or finger). A click on a work leads to it.
       "Random / Index" under it changes the order (the page always starts in Index):
       Random = the order of the works in projects.json, Index = by their "order" number.
       To add a work, add it to projects.json (see projects.js) -->
  <main class="carousel-section">
    <div class="carousel">
      <div class="carousel-track">
      <!-- The works come from projects.json (home-carousel.js puts them here) -->
      </div>
    </div>
    <!-- Under the row: "Random / Index". Under a finger it turns into the category (red) / the name of the work -->
    <p class="carousel-modes">
      <span class="carousel-switch">
        <button class="carousel-mode" type="button" data-mode="random" aria-pressed="false">Random</button> /
        <button class="carousel-mode is-active" type="button" data-mode="index" aria-pressed="true">Index</button>
      </span>
      <span class="carousel-name" aria-hidden="true"><span class="carousel-category"></span> / <span class="carousel-work"></span></span>
    </p>
  </main>

  <!-- The fly: sits on the name and flies away when the mouse touches it (moved by script.js) -->
  <img class="fly" src="images/fly.webp" width="680" height="500" alt="" aria-hidden="true">

  <script src="script.js"></script>
  <script src="projects.js"></script>
  <script src="home-carousel.js"></script>
  <script src="top-bar-blur.js"></script>
  <!-- A click on "YP" turns it into a fly that flies off to the home page -->
  <script src="yp-fly.js"></script>
</body>
</html>
