<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoav Paul</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <!-- Top bar (stays at the top while scrolling, with a soft blur behind it):
       on the left where you are, "YP" in the middle (leads home), Contact on the right -->
  <header class="top-bar">
    <p class="top-bar-left">Over view / <a class="page-link text-muted" href="projects.html">Index</a></p>
    <a class="top-bar-name" href="index.html" aria-label="Yoav Paul, home page">YP</a>
    <a class="top-bar-contact" href="about.html">Contact</a>
  </header>

  <!-- Big name (the fly sits on it, see below) -->
  <section class="hero">
    <h1 class="hero-title">YOAVPAUL</h1>
  </section>

  <!-- Leads to the contact page. "ME" turns red under the mouse -->
  <p class="catch-me"><a class="page-link" href="about.html">Catch <span class="catch-me-big">ME</span> if you can!</a></p>

  <!-- Over view: all the works move slowly from left to right, in a loop (home-carousel.js).
       It stops under the mouse, the name of the work under the mouse shows above it,
       and it can be scrolled sideways (trackpad, mouse wheel or finger). A click on a work leads to it.
       "Random / Index" under it changes the order:
       Random = the order here (the works take turns: branding, photography, graphics...),
       Index = by category, like the lists on the index page (data-index = the place in that order).
       To add a work, add one more line like these (--ratio = its width / height) -->
  <main class="carousel-section">
    <p class="carousel-name" aria-hidden="true"></p>
    <div class="carousel">
      <div class="carousel-track">
      <a class="carousel-item" href="branding.html#the-lodge" data-name="The Lodge x Core De Roy" data-category="branding" data-index="2" style="--ratio: 1 / 1;"><img src="images/thelodge-corederoy-logo-negative.png" alt="The Lodge x Core De Roy"></a>
      <a class="carousel-item" href="photography.html#dissociative-self" data-name="Dissociative self" data-category="photography" data-index="4" style="--ratio: 1049 / 855;"><img class="is-cropped" style="--img-top: -44.06; --img-left: -4.36; --img-width: 108.75; --img-height: 188.58;" src="images/photo-my-project-6.jpg" alt="Dissociative self"></a>
      <a class="carousel-item" href="graphics.html#im-here" data-name="I’M HERE?" data-category="graphics" data-index="10" style="--ratio: 694 / 982;"><img src="images/tartakover-poster.jpg" alt="I’M HERE?"></a>
      <a class="carousel-item" href="photography.html#monsters-under-the-bed" data-name="Monsters Under The Bed - Guy Jarzin" data-category="photography" data-index="6" style="--ratio: 840 / 1216;"><img src="images/yarzin-photoshoot.jpg" alt="Monsters Under The Bed - Guy Jarzin"></a>
      <a class="carousel-item" href="branding.html#cinema-south-festival" data-name="Cinema South Festival" data-category="branding" data-index="1" style="--ratio: 1484 / 1526;"><img src="images/sff-logo.png" alt="Cinema South Festival"></a>
      <a class="carousel-item" href="photography.html#four-noble-truths" data-name="Four noble truths before bedtime" data-category="photography" data-index="5" style="--ratio: 1044 / 818;"><img src="images/photo-yoav367.jpg" alt="Four noble truths before bedtime"></a>
      <a class="carousel-item" href="graphics.html#soccer-joint" data-name="Soccer - Joint" data-category="graphics" data-index="9" style="--ratio: 907 / 1296;"><img src="images/poster-joint-soccer.jpg" alt="Soccer - Joint"></a>
      <a class="carousel-item" href="photography.html#megi-solar" data-name="Megi Solar" data-category="photography" data-index="7" style="--ratio: 845.913 / 1216;"><img src="images/photo-yoavp1150.jpg" alt="Megi Solar"></a>
      <a class="carousel-item" href="branding.html#biss" data-name="biss" data-category="branding" data-index="3" style="--ratio: 2560 / 2551;"><img src="images/logo-1.png" alt="biss"></a>
      <a class="carousel-item" href="photography.html#bank-leumi" data-name="Bank Leumi - Local Treasure" data-category="photography" data-index="8" style="--ratio: 1034 / 686;"><img src="images/photo-illustration-14.jpg" alt="Bank Leumi - Local Treasure"></a>
      </div>
    </div>
    <p class="carousel-modes">
      <button class="carousel-mode is-active" type="button" data-mode="random" aria-pressed="true">Random</button> /
      <button class="carousel-mode" type="button" data-mode="index" aria-pressed="false">Index</button>
    </p>
  </main>

  <!-- The fly: sits on the name and flies away when the mouse touches it (moved by script.js) -->
  <img class="fly" src="images/fly.png" alt="" aria-hidden="true">

  <script src="script.js"></script>
  <script src="home-carousel.js"></script>
</body>
</html>
